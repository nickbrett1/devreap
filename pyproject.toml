[project]
name = "devreap"
version = "0.1.0"
description = "Stop the devcontainers you are not actually working on, and close their VS Code windows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

# This pyproject exists so other projects can depend on devreap as a library
# (devdash imports containers.list_devcontainers, vscode.close_workspace_window
# and buildkite.last_human_build). The CLI is still installed by install.py,
# which clones the repo and drops a /usr/local/bin/devreap shim on PYTHONPATH —
# no console_scripts here, so a `pip install` can never shadow that shim.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["devreap"]
